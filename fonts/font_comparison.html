<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATM10 폰트 비교</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f4f5f7;
      --panel-bg: #ffffff;
      --text: #17191d;
      --muted: #68707c;
      --border: #d8dce2;
      --accent: #1769e0;
      --preview-bg: #f7f8fa;
      --preview-text: #111318;
      --preview-size: 27px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Noto Sans KR", sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    input,
    select,
    textarea,
    .drop-zone {
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    .drop-zone:focus-within {
      outline: 3px solid rgb(23 105 224 / 22%);
      outline-offset: 2px;
    }

    .page {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 36px);
    }

    header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(300px, 1.4fr) minmax(220px, 0.8fr) minmax(160px, 0.5fr);
      gap: 14px;
      margin-bottom: 20px;
      padding: 18px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .field {
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .field label,
    .field legend {
      font-weight: 700;
    }

    textarea,
    select {
      width: 100%;
      background: var(--panel-bg);
      color: var(--text);
      padding: 10px 12px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.5;
    }

    input[type="range"] {
      width: 100%;
      border: 0;
    }

    .size-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
    }

    .size-value {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 150px;
      padding: 16px;
      background: #f8fbff;
      border-style: dashed;
      text-align: center;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .drop-zone.is-dragging {
      background: #eaf3ff;
      border-color: var(--accent);
    }

    .drop-zone label {
      display: grid;
      gap: 8px;
      cursor: pointer;
    }

    .drop-zone span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }

    #font-files {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      min-height: 24px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .font-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 16px;
    }

    .font-card {
      overflow: hidden;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .font-card-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .font-card-header h2 {
      margin: 0 0 4px;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .font-meta {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .remove-button {
      flex: 0 0 auto;
      padding: 6px 9px;
      background: var(--panel-bg);
      color: var(--muted);
      cursor: pointer;
    }

    .remove-button:hover {
      color: #b42318;
      border-color: #f1a7a1;
    }

    .font-preview {
      min-height: 270px;
      padding: 20px;
      background: var(--preview-bg);
      color: var(--preview-text);
      font-size: var(--preview-size);
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      transition: background 120ms ease, color 120ms ease;
    }

    .font-grid[data-preview-theme="dark"] {
      --preview-bg: #181b20;
      --preview-text: #f4f5f7;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 48px 20px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .drop-zone {
        min-height: 120px;
      }
    }

    @media (max-width: 560px) {
      .page {
        padding: 18px;
      }

      .controls {
        padding: 14px;
      }

      .font-preview {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>ATM10 폰트 비교</h1>
      <p>같은 문장과 크기로 여러 폰트를 비교합니다. HTML 파일을 브라우저에서 열고 폰트 파일을 추가하세요.</p>
    </header>

    <section class="controls" aria-label="비교 설정">
      <div class="field">
        <label for="sample-text">비교 문장</label>
        <textarea id="sample-text" spellcheck="false">Applied Energistics 2 저장소
기계 설정 및 업그레이드
퀘스트를 완료하고 보상을 받으세요.
에너지 입력: 12,345 FE/t
외계어 확인: 궭 뷁 궦 킫
기호 확인: µ É – à ó ç ¬</textarea>
      </div>

      <div class="field">
        <div class="size-line">
          <label for="font-size">Minecraft TTF size · 3배 확대</label>
          <output class="size-value" id="font-size-value" for="font-size">9.0</output>
        </div>
        <input id="font-size" type="range" min="8" max="12" value="9" step="0.5">

        <label for="preview-theme">미리보기 배경</label>
        <select id="preview-theme">
          <option value="light">밝은 배경</option>
          <option value="dark">어두운 배경</option>
        </select>
      </div>

      <div class="drop-zone" id="drop-zone">
        <label for="font-files">
          폰트 파일 추가
          <span>여러 파일 선택 또는 여기로 끌어놓기</span>
          <input id="font-files" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" multiple>
        </label>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="font-grid" id="font-grid" data-preview-theme="light" aria-label="폰트 비교 결과"></section>

    <p class="note">
      기본 비교 폰트는 이 HTML을 기준으로 한 상대 경로에서 불러옵니다. 브라우저의 대체 글꼴과 Minecraft의 렌더링 방식은 다를 수 있으므로 최종 선택은 게임 화면에서도 확인하세요.
    </p>
  </main>

  <script>
    "use strict";

    const presets = [
      {
        name: "경기천년제목 Medium",
        path: "../output/resourcepack/ATM10_Korean/assets/minecraft/font/gyeonggi_title_medium.ttf",
        format: "truetype"
      },
      {
        name: "The Jamsil Regular",
        path: "The_Jamsil/The_Jamsil_TTF_2024/The Jamsil 3 Regular.ttf",
        format: "truetype"
      },
      {
        name: "The Jamsil Medium",
        path: "The_Jamsil/The_Jamsil_TTF_2024/The Jamsil 4 Medium.ttf",
        format: "truetype"
      }
    ];

    const supportedExtensions = new Set(["ttf", "otf", "woff", "woff2"]);
    const formatByExtension = {
      ttf: "truetype",
      otf: "opentype",
      woff: "woff",
      woff2: "woff2"
    };

    const sampleText = document.getElementById("sample-text");
    const fontSize = document.getElementById("font-size");
    const fontSizeValue = document.getElementById("font-size-value");
    const previewTheme = document.getElementById("preview-theme");
    const fontFiles = document.getElementById("font-files");
    const dropZone = document.getElementById("drop-zone");
    const fontGrid = document.getElementById("font-grid");
    const status = document.getElementById("status");

    const loadedFonts = [];
    let nextFontId = 1;

    function escapeFontSource(value) {
      return value.replaceAll("\\", "\\\\").replaceAll('"', '\\"');
    }

    function makeFamilyName() {
      return `ATM10FontComparison${nextFontId++}`;
    }

    function fileSizeLabel(bytes) {
      if (!Number.isFinite(bytes)) {
        return "기본 폰트";
      }
      if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(0)} KB`;
      }
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "#b42318" : "";
    }

    function updatePreviewSettings() {
      const selectedSize = Number(fontSize.value);
      fontSizeValue.value = selectedSize.toFixed(1);
      document.documentElement.style.setProperty("--preview-size", `${selectedSize * 3}px`);
      fontGrid.dataset.previewTheme = previewTheme.value;

      for (const preview of fontGrid.querySelectorAll(".font-preview")) {
        preview.textContent = sampleText.value;
      }
    }

    function renderFontCards() {
      fontGrid.replaceChildren();

      if (loadedFonts.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "비교할 폰트를 추가하세요.";
        fontGrid.append(empty);
        return;
      }

      for (const item of loadedFonts) {
        const card = document.createElement("article");
        card.className = "font-card";

        const header = document.createElement("div");
        header.className = "font-card-header";

        const titleGroup = document.createElement("div");
        const title = document.createElement("h2");
        title.textContent = item.name;
        const meta = document.createElement("div");
        meta.className = "font-meta";
        meta.textContent = `${item.sourceLabel} · ${fileSizeLabel(item.bytes)}`;
        titleGroup.append(title, meta);

        const remove = document.createElement("button");
        remove.className = "remove-button";
        remove.type = "button";
        remove.textContent = "제거";
        remove.setAttribute("aria-label", `${item.name} 비교에서 제거`);
        remove.addEventListener("click", () => removeFont(item.id));

        const preview = document.createElement("div");
        preview.className = "font-preview";
        preview.style.fontFamily = `"${item.family}"`;
        preview.textContent = sampleText.value;

        header.append(titleGroup, remove);
        card.append(header, preview);
        fontGrid.append(card);
      }
    }

    function removeFont(id) {
      const index = loadedFonts.findIndex((font) => font.id === id);
      if (index === -1) {
        return;
      }

      const [removed] = loadedFonts.splice(index, 1);
      document.fonts.delete(removed.fontFace);
      if (removed.objectUrl) {
        URL.revokeObjectURL(removed.objectUrl);
      }
      renderFontCards();
      updatePreviewSettings();
      setStatus(`${removed.name}을(를) 비교에서 제거했습니다.`);
    }

    async function registerFont({ name, source, format, sourceLabel, bytes, objectUrl = null }) {
      const family = makeFamilyName();
      const safeSource = escapeFontSource(source);
      const fontFace = new FontFace(family, `url("${safeSource}") format("${format}")`);
      await fontFace.load();
      document.fonts.add(fontFace);

      loadedFonts.push({
        id: family,
        name,
        family,
        fontFace,
        sourceLabel,
        bytes,
        objectUrl
      });
    }

    async function loadPresetFont(preset) {
      try {
        await registerFont({
          name: preset.name,
          source: preset.path,
          format: preset.format,
          sourceLabel: "기본 비교",
          bytes: Number.NaN
        });
        return null;
      } catch (error) {
        return `${preset.name}: ${error.message}`;
      }
    }

    async function loadFile(file) {
      const extension = file.name.split(".").pop()?.toLowerCase() ?? "";
      if (!supportedExtensions.has(extension)) {
        throw new Error(`${file.name}: 지원하지 않는 파일 형식입니다.`);
      }

      const objectUrl = URL.createObjectURL(file);
      try {
        await registerFont({
          name: file.name.replace(/\.[^.]+$/, ""),
          source: objectUrl,
          format: formatByExtension[extension],
          sourceLabel: file.name,
          bytes: file.size,
          objectUrl
        });
      } catch (error) {
        URL.revokeObjectURL(objectUrl);
        throw new Error(`${file.name}: ${error.message}`);
      }
    }

    async function loadFiles(files) {
      const selected = [...files];
      if (selected.length === 0) {
        return;
      }

      setStatus(`${selected.length}개 폰트를 불러오는 중입니다.`);
      const errors = [];
      for (const file of selected) {
        try {
          await loadFile(file);
        } catch (error) {
          errors.push(error.message);
        }
      }

      renderFontCards();
      updatePreviewSettings();
      fontFiles.value = "";

      if (errors.length > 0) {
        setStatus(`일부 파일을 불러오지 못했습니다: ${errors.join(" / ")}`, true);
      } else {
        setStatus(`${selected.length}개 폰트를 추가했습니다.`);
      }
    }

    sampleText.addEventListener("input", updatePreviewSettings);
    fontSize.addEventListener("input", updatePreviewSettings);
    previewTheme.addEventListener("change", updatePreviewSettings);
    fontFiles.addEventListener("change", () => loadFiles(fontFiles.files));

    for (const eventName of ["dragenter", "dragover"]) {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add("is-dragging");
      });
    }

    for (const eventName of ["dragleave", "drop"]) {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove("is-dragging");
      });
    }

    dropZone.addEventListener("drop", (event) => loadFiles(event.dataTransfer.files));

    async function initialize() {
      setStatus("기본 비교 폰트를 불러오는 중입니다.");
      const errors = [];
      for (const preset of presets) {
        const error = await loadPresetFont(preset);
        if (error) {
          errors.push(error);
        }
      }
      renderFontCards();
      updatePreviewSettings();

      if (errors.length > 0) {
        setStatus(`일부 기본 폰트를 불러오지 못했습니다: ${errors.join(" / ")}`, true);
      } else {
        setStatus("기본 폰트 3개를 불러왔습니다. 다른 폰트도 추가할 수 있습니다.");
      }
    }

    initialize();
  </script>
</body>
</html>
